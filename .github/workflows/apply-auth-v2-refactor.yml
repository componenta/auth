name: Apply verified auth v2 refactor

on:
  push:
    branches: [v2]
    paths:
      - .auth-v2-refactor.ready

permissions:
  contents: write

concurrency:
  group: apply-auth-v2-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          base="24fe425b1adff9a9b3fa63e604569a6bffc0fab7"
          git merge-base --is-ancestor "$base" HEAD

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/apply-auth-v2-refactor.yml|.auth-v2-refactor.ready|.auth-v2-refactor.part-*) ;;
              *)
                echo "Unexpected branch drift before refactor application: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$base"...HEAD)

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Apply replacement overlay
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat .auth-v2-refactor.part-* | base64 --decode > "$work/refactor.tar.gz"
          test "$(sha256sum "$work/refactor.tar.gz" | cut -d' ' -f1)" = "5d2305308bedab314423b3f9e0cc3006d3ce57e9ef759ecffc3cf3a83a71005f"
          mkdir "$work/unpacked"
          tar -xzf "$work/refactor.tar.gz" -C "$work/unpacked"

          while IFS= read -r path; do
            if [[ -n "$path" ]]; then
              rm -rf -- "$path"
            fi
          done < "$work/unpacked/delete-list.txt"

          cp -a "$work/unpacked/replacement/." .
          rm -f .auth-v2-refactor.ready .auth-v2-refactor.part-*
          rm -f .github/workflows/apply-auth-v2-refactor.yml

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer check-platform-reqs
          composer lint

          for removed in \
            AuthSubject \
            AuthSubjectInterface \
            SessionAwareInterface \
            RememberMeAwareInterface \
            PasswordUpdaterInterface \
            TokenRequester \
            OtpRequester
          do
            if grep -R --line-number --fixed-strings "$removed" src tests; then
              echo "Removed symbol still referenced: $removed" >&2
              exit 1
            fi
          done

          if grep -R --line-number -E 'getAttributes\(|isEmpty\(|shouldClear\(|payloads\(' src tests; then
            echo 'Legacy getter-style state API is still referenced.' >&2
            exit 1
          fi

          composer test
          composer phpstan
          composer audit --no-interaction
          git diff --check

      - name: Commit directly to v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Andrey Shelamkoff"
          git config user.email "inbox.shelamkoff@gmail.com"
          git add -A
          git commit -m "refactor(auth): simplify identity and harden v2 contracts"
          git push origin HEAD:v2
