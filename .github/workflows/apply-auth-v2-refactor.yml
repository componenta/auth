name: Apply verified auth v2 refactor

on:
  push:
    branches: [v2]
    paths:
      - .auth-v2-refactor.b64

permissions:
  contents: write

concurrency:
  group: apply-auth-v2-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 3

      - name: Verify immutable starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "24fe425b1adff9a9b3fa63e604569a6bffc0fab7"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Apply replacement overlay
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          base64 --decode .auth-v2-refactor.b64 > "$work/refactor.tar.gz"
          mkdir "$work/unpacked"
          tar -xzf "$work/refactor.tar.gz" -C "$work/unpacked"

          while IFS= read -r path; do
            if [[ -n "$path" ]]; then
              rm -rf -- "$path"
            fi
          done < "$work/unpacked/delete-list.txt"

          cp -a "$work/unpacked/replacement/." .
          rm -f .auth-v2-refactor.b64
          rm -f .github/workflows/apply-auth-v2-refactor.yml

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify source and tests
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer check-platform-reqs
          composer lint

          for removed in \
            AuthSubject \
            AuthSubjectInterface \
            SessionAwareInterface \
            RememberMeAwareInterface \
            PasswordUpdaterInterface \
            TokenRequester \
            OtpRequester
          do
            if grep -R --line-number --fixed-strings "$removed" src tests; then
              echo "Removed symbol still referenced: $removed" >&2
              exit 1
            fi
          done

          if grep -R --line-number -E 'getAttributes\(|isEmpty\(|shouldClear\(|payloads\(' src tests; then
            echo 'Legacy getter-style state API is still referenced.' >&2
            exit 1
          fi

          composer test
          composer phpstan
          composer audit --no-interaction
          git diff --check

      - name: Commit directly to v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Andrey Shelamkoff"
          git config user.email "inbox.shelamkoff@gmail.com"
          git add -A
          git commit -m "refactor(auth): simplify identity and harden v2 contracts"
          git push origin HEAD:v2
