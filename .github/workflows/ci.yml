# bootstrap-revision: 3
name: Bootstrap verified auth v2

on:
  push:
    branches: [v2]

permissions:
  contents: write
  statuses: write

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        di: ['2.*', '3.*']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Resolve DI matrix dependencies
        run: composer update --with "componenta/di:${{ matrix.di }}" --prefer-dist --no-interaction --no-progress

      - name: Verify or apply final source
        id: verify
        continue-on-error: true
        run: bash tools/verify.sh

      - name: Publish explicit bootstrap status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CONTEXT: auth-bootstrap/php-${{ matrix.php }}-di-${{ matrix.di }}
          STATE: ${{ steps.verify.outcome == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          payload="$(php -r 'echo json_encode([
              "state" => getenv("STATE"),
              "context" => getenv("CONTEXT"),
              "description" => getenv("STATE") === "success"
                  ? "Auth v2 bootstrap passed"
                  : "Auth v2 bootstrap failed",
              "target_url" => sprintf(
                  "https://github.com/%s/actions/runs/%s",
                  getenv("GITHUB_REPOSITORY"),
                  getenv("GITHUB_RUN_ID"),
              ),
          ], JSON_THROW_ON_ERROR);')"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            >/dev/null

      - name: Preserve verification failure
        if: steps.verify.outcome != 'success'
        run: exit 1
