name: Apply verified auth v2 fixes

on:
  push:
    branches: [v2]

permissions:
  contents: write

concurrency:
  group: apply-verified-auth-v2-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 0

      - name: Verify immutable starting point and staging scope
        shell: bash
        run: |
          set -euo pipefail
          base="cac9fa782d290f22ff21123764bd7fb5a9d32a20"
          git merge-base --is-ancestor "$base" HEAD
          unexpected="$(git diff --name-only "$base"..HEAD | grep -Ev '^(\.github/workflows/(ci\.yml|apply-auth-v2-review\.yml)|\.auth-v2-review\.(part-[0-9]{2}|ready))$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected staged paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Apply reviewed source overlay
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cat .auth-v2-review.part-* > "$work/overlay.tar.xz"
          test "$(sha256sum "$work/overlay.tar.xz" | cut -d' ' -f1)" = "e7eff824b8cbaac02af79c2d55a229ea67d45fd1ee0f3226b94ac5d2e13c972e"
          mkdir "$work/unpacked"
          tar -xJf "$work/overlay.tar.xz" -C "$work/unpacked"

          while IFS= read -r path; do
            if [[ -n "$path" ]]; then
              rm -rf -- "$path"
            fi
          done < "$work/unpacked/delete-list.txt"

          cp -a "$work/unpacked/replacement/." .
          rm -f .auth-v2-review.part-* .auth-v2-review.ready
          rm -f .github/workflows/apply-auth-v2-review.yml

      - name: Resolve and verify DI 2
        shell: bash
        run: |
          set -euo pipefail
          composer update --with 'componenta/di:2.*' --prefer-dist --no-interaction --no-progress
          bash tools/verify.sh

      - name: Commit directly to v2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor var composer.lock
          git config user.name "Andrey Shelamkoff"
          git config user.email "inbox.shelamkoff@gmail.com"
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(vendor/|var/|composer\.lock$|\.auth-v2-review\.|\.github/workflows/apply-auth-v2-review\.yml$)'; then
            echo 'Temporary verification or staging artifacts are staged.' >&2
            exit 1
          fi
          git commit -m "fix(auth): complete v2 security invariants"
          git push origin HEAD:v2
