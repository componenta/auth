name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} / DI ${{ matrix.di }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        di: ['2.*', '3.*']
    runs-on: ubuntu-latest
    env:
      AUTH_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=auth_test
      AUTH_TEST_MYSQL_USER: root
      AUTH_TEST_MYSQL_PASSWORD: root
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: auth_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql, pcntl
          coverage: none
          tools: composer:v2

      - name: Resolve DI matrix dependencies
        shell: bash
        run: |
          set -euo pipefail
          command=(composer update --with "componenta/di:${{ matrix.di }}" --prefer-dist --no-interaction --no-progress)
          if ! "${command[@]}"; then
            echo "Composer dependency resolution failed; retrying once for transient transport errors." >&2
            sleep 3
            "${command[@]}"
          fi

      - name: Verify package
        run: bash tools/verify.sh

      - name: Verify MySQL concurrency invariants
        run: php tools/verify-mysql-concurrency.php
