name: Auth 3 audit snapshot

on:
  workflow_dispatch:
  push:
    branches: [auth-3]
    paths: ['.github/workflows/audit-snapshot.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auth_session_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: auth_session_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auth_session_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      AUTH_SESSION_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=auth_session_test
      AUTH_SESSION_TEST_MYSQL_USER: root
      AUTH_SESSION_TEST_MYSQL_PASSWORD: root
      AUTH_SESSION_TEST_PG_DATABASE: auth_session_test
      AUTH_SESSION_TEST_PG_HOST: 127.0.0.1
      AUTH_SESSION_TEST_PG_PORT: '5432'
      AUTH_SESSION_TEST_PG_USER: postgres
      AUTH_SESSION_TEST_PG_PASSWORD: postgres

    steps:
      - name: Checkout audited core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Collect immutable source snapshots
        env:
          SNAPSHOT_CORE_SHA: ${{ github.sha }}
          SNAPSHOT_OUTPUT: ${{ runner.temp }}/auth3-audit
        shell: python
        run: |
          import concurrent.futures
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tarfile
          import tempfile

          # Explicit scope: componenta/session is not an authentication package.
          # This is source-review evidence, not a successful test/ASVS claim.
          branches = {
              "auth": "auth-3", "auth-app": "auth-3",
              "auth-http": "main", "auth-session": "main",
              "auth-session-database": "main", "auth-session-http": "main",
              "auth-session-app": "main", "auth-password": "main",
              "auth-remember-me": "main", "auth-token": "main",
              "auth-magic-link": "main", "auth-jwt": "main",
              "auth-otp": "main", "auth-webauthn": "main",
              "auth-totp": "main", "auth-recovery-code": "main",
          }
          output = pathlib.Path(os.environ["SNAPSHOT_OUTPUT"])
          output.mkdir(parents=True, exist_ok=True)
          sources = output / "sources"
          sources.mkdir()
          core = pathlib.Path.cwd()

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def collect(item):
              name, branch = item
              with tempfile.TemporaryDirectory() as temporary:
                  temporary = pathlib.Path(temporary)
                  if name == "auth":
                      repository = core
                      sha = os.environ["SNAPSHOT_CORE_SHA"]
                  else:
                      repository = temporary / "checkout"
                      subprocess.run([
                          "git", "clone", "--depth=1", "--single-branch",
                          "--branch", branch, "--",
                          f"https://github.com/componenta/{name}.git", str(repository),
                      ], check=True)
                      sha = git("-C", str(repository), "rev-parse", "HEAD")
                  archive = temporary / "source.tar"
                  git("-C", str(repository), "archive", "--format=tar", "-o", str(archive), sha)
                  destination = sources / name
                  destination.mkdir()
                  with tarfile.open(archive) as stream:
                      stream.extractall(destination, filter="data")
                  return name, {
                      "repository": f"componenta/{name}", "branch": branch,
                      "commit": sha,
                      "tree": git("-C", str(repository), "rev-parse", f"{sha}^{{tree}}"),
                      "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                  }

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              manifest = dict(sorted(pool.map(collect, branches.items())))
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          with tarfile.open(output / "auth3-sources.tar.gz", "w:gz") as archive:
              archive.add(sources, arcname="sources")
              archive.add(output / "manifest.json", arcname="manifest.json")
          print(json.dumps(manifest, indent=2))

      - name: Setup audit PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          extensions: dom, mbstring, xml, xmlwriter, pdo_sqlite, pdo_mysql, pdo_pgsql, sodium
          tools: composer:v2

      - name: Verify the captured package set together
        env:
          SNAPSHOT_OUTPUT: ${{ runner.temp }}/auth3-audit
        shell: python
        run: |
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile

          root = pathlib.Path(os.environ["SNAPSHOT_OUTPUT"])
          manifest = json.loads((root / "manifest.json").read_text())
          versions = {"componenta/" + name: "dev-" + item["branch"] for name, item in manifest.items()}
          require = dict(versions)
          tests = {}
          repositories = {}
          packages = {}
          for name in manifest:
              package = json.loads((root / "sources" / name / "composer.json").read_text())
              packages[name] = package
              for dependency, constraint in package.get("require-dev", {}).items():
                  if dependency not in versions:
                      previous = require.setdefault(dependency, constraint)
                      if previous != constraint:
                          raise RuntimeError("Conflicting audit dev constraints: " + dependency)
              for namespace, paths in package.get("autoload-dev", {}).get("psr-4", {}).items():
                  paths = [paths] if isinstance(paths, str) else paths
                  tests[namespace] = ["sources/" + name + "/" + path for path in paths]
              for repository in package.get("repositories", []):
                  if repository.get("type") == "vcs":
                      repositories[repository["url"]] = repository
          composer = {
              "name": "componenta/auth3-audit-workspace", "type": "project",
              "require": require, "minimum-stability": "dev", "prefer-stable": True,
              "repositories": [{"type": "path", "url": "sources/*", "options": {
                  "symlink": True, "versions": versions,
              }}, *repositories.values()],
              "autoload-dev": {"psr-4": tests},
              "config": {"allow-plugins": {"pestphp/pest-plugin": True}},
          }
          (root / "composer.json").write_text(json.dumps(composer, indent=2) + "\n")
          subprocess.run(["composer", "update", "--no-interaction", "--no-progress", "--prefer-dist"], cwd=root, check=True)
          results = {}
          logs = root / "verification"
          logs.mkdir()
          for name, package in packages.items():
              directory = root / "sources" / name
              (directory / "vendor").symlink_to("../../vendor", target_is_directory=True)
              results[name] = {}
              for label, command in {
                  "tests": ["php", "vendor/bin/pest", "--test-directory=sources/" + name + "/tests", "--configuration=phpunit.xml.dist"] if "pestphp/pest" in package.get("require-dev", {}) else ["php", "vendor/bin/phpunit", "--configuration", "phpunit.xml.dist"],
                  "phpstan": ["php", "vendor/bin/phpstan", "analyse", "src", "--level=max", "--no-progress"],
              }.items():
                  if label == "tests":
                      command.extend(["--log-junit", str(logs / (name + "-junit.xml"))])
                  with (logs / (name + "-" + label + ".log")).open("w") as log:
                      result = subprocess.run(command, cwd=directory, stdout=log, stderr=subprocess.STDOUT)
                  results[name][label] = result.returncode
                  print(name, label, result.returncode, flush=True)
          with (logs / "composer-audit.json").open("w") as log:
              audit = subprocess.run(["composer", "audit", "--format=json", "--no-interaction"], cwd=root, stdout=log, stderr=subprocess.STDOUT)
          (logs / "results.json").write_text(json.dumps({"packages": results, "composer_audit": audit.returncode}, indent=2) + "\n")
          # Preserve resolved dependencies and native modules for offline reproduction.
          # No Composer home, checkout credentials or environment secrets are archived.
          runtime = root / "runtime"
          runtime.mkdir()
          extension_dir = pathlib.Path(subprocess.check_output(["php", "-r", "echo ini_get('extension_dir');"], text=True))
          for module in ["dom", "mbstring", "xml", "xmlreader", "xmlwriter", "pdo_sqlite", "sqlite3"]:
              path = extension_dir / (module + ".so")
              if path.is_file():
                  shutil.copy2(path, runtime / path.name)
          with tarfile.open(root / "auth3-verification.tar.gz", "w:gz") as archive:
              for name in ["sources", "vendor", "runtime", "verification", "manifest.json", "composer.json", "composer.lock"]:
                  archive.add(root / name, arcname=name)
          if audit.returncode or any(code for item in results.values() for code in item.values()):
              raise SystemExit(1)

      - name: Preserve audit sources and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth3-audit-sources
          path: |
            ${{ runner.temp }}/auth3-audit/auth3-sources.tar.gz
            ${{ runner.temp }}/auth3-audit/auth3-verification.tar.gz
            ${{ runner.temp }}/auth3-audit/manifest.json
            ${{ runner.temp }}/auth3-audit/verification/
          if-no-files-found: error
          retention-days: 7
